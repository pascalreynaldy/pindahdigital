<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Tidak Ditemukan</title>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #F4F6F9;
            --navy: #0F2044;
            --navy-light: #223769;
            --yellow: #F6C243;
            --white: #FFFFFF;
            --gray-text: #6B7280;
            --gray-light: #E5E7EB;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-full: 9999px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: #333;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Mobile Container to simulate mobile app view */
        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-body);
            height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        .navbar {
            background-color: var(--navy);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--white);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            font-weight: 700;
            font-size: 20px;
            font-style: italic;
            letter-spacing: -0.5px;
            color: #FFF;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pill, .icon-btn, .user-pill {
            padding: 6px 12px;
            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            border: none;
            cursor: pointer;
        }

        .yellow-pill {
            background-color: var(--yellow);
            color: var(--navy);
        }

        .user-pill {
            background-color: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--white);
        }

        /* Sidebar Styles */
        .sidebar-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
        }

        .sidebar-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .sidebar {
            position: absolute;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background-color: var(--white);
            z-index: 2001;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            transition: left 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .sidebar.show {
            left: 0;
        }

        .sidebar-header {
            padding: 20px;
            background-color: var(--navy);
            color: var(--white);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-sidebar {
            background: none;
            border: none;
            color: var(--white);
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
        }

        .sidebar-content {
            padding: 20px 0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-link {
            padding: 16px 20px;
            color: var(--navy);
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: background-color 0.2s;
        }

        .sidebar-link:hover {
            background-color: #F4F6F9;
        }

        .sidebar-link.active {
            background-color: #F0F4FF;
            color: var(--navy-light);
            border-left: 4px solid var(--yellow);
        }
        
        .sidebar-link i {
            width: 20px;
            text-align: center;
            color: var(--gray-text);
        }

        .sidebar-link.active i {
            color: var(--navy-light);
        }

        /* Not Found Content */
        .not-found-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            text-align: center;
        }

        .not-found-icon {
            font-size: 64px;
            color: var(--gray-light);
            margin-bottom: 24px;
        }

        .not-found-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 12px;
        }

        .not-found-desc {
            font-size: 14px;
            color: var(--gray-text);
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .btn-back {
            background-color: var(--navy-light);
            color: var(--white);
            padding: 12px 24px;
            border-radius: var(--radius-full);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(34, 55, 105, 0.2);
            transition: background-color 0.2s;
        }

        .btn-back:hover {
            background-color: var(--navy);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar Container -->
        <div id="sidebar-container"></div>

        <!-- Navbar -->
        <header class="navbar">
            <div style="display: flex; align-items: center; gap: 12px;">
                <button id="sidebarToggle" style="background: none; border: none; color: white; font-size: 20px; cursor: pointer; padding: 4px;">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="logo">
                    <span class="mandiri-text">mandiri</span>
                </div>
            </div>
            <div class="nav-actions">
                <div class="user-pill">
                    <i class="fa-regular fa-user"></i>
                    <span>RICKYMARIO62</span>
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                </div>
            </div>
        </header>

        <!-- Not Found Content -->
        <div class="not-found-content">
            <i class="fa-solid fa-screwdriver-wrench not-found-icon"></i>
            <h1 class="not-found-title">Sedang Dalam Perbaikan</h1>
            <p class="not-found-desc">Halaman yang Anda tuju saat ini masih dalam tahap pengembangan. Silakan kembali ke halaman utama.</p>
            <a href="mandiri_spot.html" class="btn-back">
                <i class="fa-solid fa-arrow-left"></i> Kembali ke Peta
            </a>
        </div>

    </div>

    <!-- Sidebar Script -->
    <script src="sidebar.js"></script>
</body>
</html>
